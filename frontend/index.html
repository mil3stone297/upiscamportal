<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Report and track UPI digital payment fraud incidents. Help protect India's digital payment ecosystem by reporting scams." />
    <meta name="keywords" content="UPI fraud, payment scam, report fraud, digital payment security, India" />
    <title>UPI Scam Portal — Report & Track Digital Payment Fraud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ─── Navigation ─────────────────────────────────────────────────── -->
    <nav class="navbar" id="main-navbar">
      <div class="nav-container">
        <a href="#" class="nav-brand" id="nav-brand-link">
          <span class="nav-brand-icon">🛡️</span>
          <span class="nav-brand-text">UPI Scam Portal</span>
        </a>
        <div class="nav-actions">
          <button class="btn btn-outline" id="nav-dashboard-btn">Dashboard</button>
          <button class="btn btn-primary" id="nav-report-btn">+ New Report</button>
        </div>
      </div>
    </nav>

    <!-- ─── Toast Notifications ───────────────────────────────────────── -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- ─── Confirmation Modal ───────────────────────────────────────── -->
    <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal">
        <div class="modal-icon">🗑️</div>
        <h2 class="modal-title" id="modal-title">Delete Report</h2>
        <p class="modal-message" id="modal-message">Are you sure you want to delete this report? This action cannot be undone.</p>
        <div class="modal-actions">
          <button class="btn btn-outline" id="modal-cancel-btn">Cancel</button>
          <button class="btn btn-danger" id="modal-confirm-btn">Delete</button>
        </div>
      </div>
    </div>

    <!-- ─── Main Content ──────────────────────────────────────────────── -->
    <main class="main-content" id="app-root">
      <!-- Views are dynamically rendered here -->
    </main>

    <!-- ─── Scripts ───────────────────────────────────────────────────── -->
    <script src="js/components/toast.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/api.js"></script>
    <script src="js/views/home.js"></script>
    <script src="js/views/report-form.js"></script>
    <script src="js/views/report-detail.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
